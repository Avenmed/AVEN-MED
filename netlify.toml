[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Server-side OAuth (Netlify Functions). The Client Secret and Podium tokens live only
# here — never in the client bundle.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Redirects (evaluated top-to-bottom). Defined here in netlify.toml — which
# Netlify reads directly from the repo root — so they never depend on a
# _redirects file being copied into the publish directory.
# ---------------------------------------------------------------------------

# Legacy paths → Assessment (migrated from the old, misplaced root _redirects).
[[redirects]]
  from = "/aura"
  to = "/assessment"
  status = 301

[[redirects]]
  from = "/aura/*"
  to = "/assessment"
  status = 301

[[redirects]]
  from = "/reading"
  to = "/assessment"
  status = 301

[[redirects]]
  from = "/reading/*"
  to = "/assessment"
  status = 301

# Podium OAuth server-side endpoints → Netlify Functions. MUST come BEFORE the SPA
# fallback so these API routes reach the functions instead of index.html. The public
# URLs stay clean and predictable; the callback URL is what Podium redirects back to.
[[redirects]]
  from = "/api/podium/oauth/start"
  to = "/.netlify/functions/podium-oauth-start"
  status = 200

[[redirects]]
  from = "/api/podium/oauth/callback"
  to = "/.netlify/functions/podium-oauth-callback"
  status = 200

# Bridal Journey lead handoff → Podium (server-side; browser POSTs here).
[[redirects]]
  from = "/api/podium/bridal-submit"
  to = "/.netlify/functions/podium-bridal-submit"
  status = 200

# Website lead → Podium webhook (server-side; browser POSTs here). ONE endpoint for
# every lead source — `website_lead_source` in the body distinguishes them. The Podium
# webhook URL lives only in the PODIUM_WEBHOOK_URL env var, never in the bundle.
[[redirects]]
  from = "/api/podium/lead"
  to = "/.netlify/functions/podium-lead"
  status = 200

# ---------------------------------------------------------------------------
# Retired legacy service routes (Wave 11 content completion).
#
# /service/<slug> predated the current registry-driven pages. Five slugs were
# still LIVE, index/follow and self-canonical while being thin, duplicated by a
# real page, absent from the sitemap and linked from nowhere. Each is retired to
# its canonical current equivalent, resolved from the content registry — never
# guessed. These MUST stay above the SPA fallback so the request is redirected at
# the edge and the legacy URL never renders an independent indexable document.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/service/lip-filler"
  to = "/lip-fillers-orland-park"
  status = 301

[[redirects]]
  from = "/service/neuromodulators"
  to = "/botox-orland-park"
  status = 301

[[redirects]]
  from = "/service/microneedling"
  to = "/skinpen-microneedling-orland-park"
  status = 301

[[redirects]]
  from = "/service/sculptra"
  to = "/sculptra-orland-park"
  status = 301

[[redirects]]
  from = "/service/iv-therapy"
  to = "/wellness/iv-therapy"
  status = 301

# Any other /service/* path is a legacy shape with no current equivalent — send it
# to the Aesthetics hub rather than letting the SPA render a thin legacy page.
[[redirects]]
  from = "/service/*"
  to = "/aesthetics"
  status = 301

# SPA fallback — every other clean route serves the app (History-API routing).
# Existing static files in the publish dir (assets, robots.txt, sitemap.xml)
# are served before this rule applies.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

# Content-hashed build assets never change — cache them hard.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
