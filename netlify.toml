[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Redirects (evaluated top-to-bottom). Defined here in netlify.toml — which
# Netlify reads directly from the repo root — so they never depend on a
# _redirects file being copied into the publish directory.
# ---------------------------------------------------------------------------

# Legacy paths → Assessment (migrated from the old, misplaced root _redirects).
[[redirects]]
  from = "/aura"
  to = "/assessment"
  status = 301

[[redirects]]
  from = "/aura/*"
  to = "/assessment"
  status = 301

[[redirects]]
  from = "/reading"
  to = "/assessment"
  status = 301

[[redirects]]
  from = "/reading/*"
  to = "/assessment"
  status = 301

# SPA fallback — every other clean route serves the app (History-API routing).
# Existing static files in the publish dir (assets, robots.txt, sitemap.xml)
# are served before this rule applies.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

# Content-hashed build assets never change — cache them hard.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
