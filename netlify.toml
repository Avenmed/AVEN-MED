[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Server-side OAuth (Netlify Functions). The Client Secret and Podium tokens live only
# here — never in the client bundle.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Redirects (evaluated top-to-bottom). Defined here in netlify.toml — which
# Netlify reads directly from the repo root — so they never depend on a
# _redirects file being copied into the publish directory.
# ---------------------------------------------------------------------------

# Legacy paths → Assessment (migrated from the old, misplaced root _redirects).
[[redirects]]
  from = "/aura"
  to = "/assessment"
  status = 301

[[redirects]]
  from = "/aura/*"
  to = "/assessment"
  status = 301

[[redirects]]
  from = "/reading"
  to = "/assessment"
  status = 301

[[redirects]]
  from = "/reading/*"
  to = "/assessment"
  status = 301

# Podium OAuth server-side endpoints → Netlify Functions. MUST come BEFORE the SPA
# fallback so these API routes reach the functions instead of index.html. The public
# URLs stay clean and predictable; the callback URL is what Podium redirects back to.
[[redirects]]
  from = "/api/podium/oauth/start"
  to = "/.netlify/functions/podium-oauth-start"
  status = 200

[[redirects]]
  from = "/api/podium/oauth/callback"
  to = "/.netlify/functions/podium-oauth-callback"
  status = 200

# SPA fallback — every other clean route serves the app (History-API routing).
# Existing static files in the publish dir (assets, robots.txt, sitemap.xml)
# are served before this rule applies.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

# Content-hashed build assets never change — cache them hard.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
